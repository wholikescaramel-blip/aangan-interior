# Hourly job: HubSpot deal-stage sync + retry of failed calls.
# Vercel Hobby only allows daily cron, so GitHub Actions calls the endpoint instead.
# Repo secrets needed: APP_BASE_URL (e.g. https://aangan-intake.vercel.app) and CRON_SECRET.
name: hourly-sync
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/sync
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set; skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/cron/sync"
