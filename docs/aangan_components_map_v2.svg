tages + won value</text><path d="M1975.8333333333333,756 L1984.8333333333333,756 L1984.8333333333333,1204 L1975.8333333333333,1204" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#a)"/><circle cx="1975.8333333333333" cy="756" r="4.5" fill="#22c55e"/><rect x="262.16666666666663" y="153" width="262" height="86" rx="9" fill="#e3e5ff" stroke="#5b5fd6" stroke-width="2"/><text x="393.16666666666663" y="180" text-anchor="middle" font-size="12.5" fill="#1f2937">Calls the studio number</text><text x="393.16666666666663" y="199" text-anchor="middle" font-size="12.5" fill="#1f2937">Any hour, day or night</text><text x="393.16666666666663" y="218" text-anchor="middle" font-size="12.5" fill="#1f2937">English, Hindi or Hinglish</text><rect x="552.4999999999999" y="265" width="262" height="86" rx="9" fill="#d6e8fc" stroke="#3a7fd5" stroke-width="2"/><text x="683.4999999999999" y="292" text-anchor="middle" font-size="12.5" fill="#1f2937">Answers in seconds, says it is AI</text><text x="683.4999999999999" y="311" text-anchor="middle" font-size="12.5" fill="#1f2937">Asks qualifying questions, one at a time</text><text x="683.4999999999999" y="330" text-anchor="middle" font-size="12.5" fill="#1f2937">Never quotes a price (the Cut)</text><rect x="842.8333333333333" y="377" width="262" height="86" rx="9" fill="#d3f0dc" stroke="#2fa65a" stroke-width="2"/><text x="973.8333333333333" y="404" text-anchor="middle" font-size="12.5" fill="#1f2937">services.md, qualified.md</text><text x="973.8333333333333" y="423" text-anchor="middle" font-size="12.5" fill="#1f2937">→ qualification_rules.md (approved)</text><text x="973.8333333333333" y="442" text-anchor="middle" font-size="12.5" fill="#1f2937">pricing.md internal: never sent to AI</text><rect x="1133.1666666666667" y="489" width="262" height="86" rx="9" fill="#dde4ec" stroke="#5f7790" stroke-width="2"/><text x="1264.1666666666667" y="516" text-anchor="middle" font-size="12.5" fill="#1f2937">Receives call-end webhook (token)</text><text x="1264.1666666666667" y="535" text-anchor="middle" font-size="12.5" fill="#1f2937">Ignores duplicates, saves the call</text><text x="1264.1666666666667" y="554" text-anchor="middle" font-size="12.5" fill="#1f2937">Response time + after-hours flag</text><rect x="1423.5" y="601" width="262" height="86" rx="9" fill="#ffefb6" stroke="#d9a400" stroke-width="2"/><text x="1554.5" y="628" text-anchor="middle" font-size="12.5" fill="#1f2937">Reads transcript against the rules</text><text x="1554.5" y="647" text-anchor="middle" font-size="12.5" fill="#1f2937">Status, reasons, summary, missing info</text><text x="1554.5" y="666" text-anchor="middle" font-size="12.5" fill="#1f2937">Free-model fallback · no-₹ guard</text><rect x="1713.8333333333333" y="713" width="262" height="86" rx="9" fill="#d2efe7" stroke="#1f9e86" stroke-width="2"/><text x="1844.8333333333333" y="740" text-anchor="middle" font-size="12.5" fill="#1f2937">Stores every call, verdict,</text><text x="1844.8333333333333" y="759" text-anchor="middle" font-size="12.5" fill="#1f2937">claim, booking and error</text><text x="1844.8333333333333" y="778" text-anchor="middle" font-size="12.5" fill="#1f2937">Idempotent on call id</text><rect x="1713.8333333333333" y="825" width="262" height="86" rx="9" fill="#d6e8fc" stroke="#3a7fd5" stroke-width="2"/><text x="1844.8333333333333" y="852" text-anchor="middle" font-size="12.5" fill="#1f2937">Lead card to designers' group</text><text x="1844.8333333333333" y="871" text-anchor="middle" font-size="12.5" fill="#1f2937">“I'll take it”: first tap wins</text><text x="1844.8333333333333" y="890" text-anchor="middle" font-size="12.5" fill="#1f2937">Qualified + needs review only</text><rect x="1713.8333333333333" y="937" width="262" height="86" rx="9" fill="#ffe2d1" stroke="#e0733a" stroke-width="2"/><text x="1844.8333333333333" y="964" text-anchor="middle" font-size="12.5" fill="#1f2937">Contact (dedupe by phone) + call log</text><text x="1844.8333333333333" y="983" text-anchor="middle" font-size="12.5" fill="#1f2937">Deal for leads; stage on claim/booking</text><text x="1844.8333333333333" y="1002" text-anchor="middle" font-size="12.5" fill="#1f2937">Won / lost set by people only</text><rect x="262.16666666666663" y="1049" width="262" height="86" rx="9" fill="#ebdcfa" stroke="#8a55c9" stroke-width="2"/><text x="393.16666666666663" y="1076" text-anchor="middle" font-size="12.5" fill="#1f2937">Designer sends booking link</text><text x="393.16666666666663" y="1095" text-anchor="middle" font-size="12.5" fill="#1f2937">Client books a consultation</text><text x="393.16666666666663" y="1114" text-anchor="middle" font-size="12.5" fill="#1f2937">(phone number required)</text><rect x="1133.1666666666667" y="1049" width="262" height="86" rx="9" fill="#ebdcfa" stroke="#8a55c9" stroke-width="2"/><text x="1264.1666666666667" y="1076" text-anchor="middle" font-size="12.5" fill="#1f2937">Signed booking webhook</text><text x="1264.1666666666667" y="1095" text-anchor="middle" font-size="12.5" fill="#1f2937">Match by phone, then email</text><text x="1264.1666666666667" y="1114" text-anchor="middle" font-size="12.5" fill="#1f2937">→ Consult booked + group note</text><rect x="1133.1666666666667" y="1161" width="262" height="86" rx="9" fill="#f6e7cf" stroke="#b9823a" stroke-width="2"/><text x="1264.1666666666667" y="1188" text-anchor="middle" font-size="12.5" fill="#1f2937">Hourly job (GitHub Actions)</text><text x="1264.1666666666667" y="1207" text-anchor="middle" font-size="12.5" fill="#1f2937">Sync deal stages and won value</text><text x="1264.1666666666667" y="1226" text-anchor="middle" font-size="12.5" fill="#1f2937">Retry any failed call</text><rect x="1713.8333333333333" y="1161" width="262" height="86" rx="9" fill="#f6e7cf" stroke="#b9823a" stroke-width="2"/><text x="1844.8333333333333" y="1188" text-anchor="middle" font-size="12.5" fill="#1f2937">/dashboard: time to first response,</text><text x="1844.8333333333333" y="1207" text-anchor="middle" font-size="12.5" fill="#1f2937">funnel, claim-time conversion,</text><text x="1844.8333333333333" y="1226" text-anchor="middle" font-size="12.5" fill="#1f2937">cost per call / lead, revenue ÷ cost</text><text x="1000" y="1294" text-anchor="middle" font-size="14" font-style="italic" fill="#374151">Built and live: Vaani → Vercel → Gemini → Neon → Telegram, plus HubSpot, Cal.com and the dashboard. Every enquiry is a channel-agnostic “Enquiry”.</text>
<text x="1000" y="1320" text-anchor="middle" font-size="14" font-style="italic" fill="#374151">Next phases (not built): unclaimed-lead escalation, reassignment, designer routing. WhatsApp and web form plug in as new Enquiry adapters.</text>
<text x="1000" y="1346" text-anchor="middle" font-size="13" fill="#6b7280">Live: aangan-interior.vercel.app  ·  Repo: github.com/wholikescaramel-blip/aangan-interior</text></svg>